<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostGram</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-header__logo">
        <span class="popup-header__icon">👻</span>
        <span class="popup-header__title">GhostGram</span>
      </div>
      <span
        id="statusBadge"
        class="popup-header__status popup-header__status--inactive"
      >
        Inativo
      </span>
    </div>

    <!-- Main Toggle -->
    <div class="popup-main-toggle">
      <div class="popup-main-toggle__row">
        <span class="popup-main-toggle__label">Extensão</span>
        <label class="toggle-switch">
          <input type="checkbox" id="mainToggle" class="toggle-switch__input" />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>
    </div>

    <!-- Quick Settings -->
    <div class="popup-settings">
      <div class="popup-settings__title">Configurações Rápidas</div>

      <!-- Panel Position -->
      <div class="popup-settings__item">
        <span class="popup-settings__item-label">Posição do Painel</span>
        <div class="popup-select" id="positionSelect">
          <button
            type="button"
            class="popup-select__button"
            id="positionSelectBtn"
          >
            <span id="positionSelectLabel">Inferior Direito</span>
            <span class="popup-select__arrow">▼</span>
          </button>
          <div class="popup-select__menu" id="positionSelectMenu">
            <button
              type="button"
              class="popup-select__option"
              data-value="top-left"
            >
              Superior Esquerdo
            </button>
            <button
              type="button"
              class="popup-select__option"
              data-value="top-right"
            >
              Superior Direito
            </button>
            <button
              type="button"
              class="popup-select__option popup-select__option--selected"
              data-value="bottom-right"
            >
              Inferior Direito
            </button>
            <button
              type="button"
              class="popup-select__option"
              data-value="bottom-left"
            >
              Inferior Esquerdo
            </button>
          </div>
        </div>
      </div>

      <!-- Start Expanded -->
      <div class="popup-settings__item">
        <span class="popup-settings__item-label">Iniciar Expandido</span>
        <label class="toggle-switch toggle-switch--small">
          <input
            type="checkbox"
            id="startExpandedToggle"
            class="toggle-switch__input"
          />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>

      <!-- Stealth Mode -->
      <div class="popup-settings__item">
        <span class="popup-settings__item-label">Modo Discreto</span>
        <label class="toggle-switch toggle-switch--small">
          <input
            type="checkbox"
            id="stealthModeToggle"
            class="toggle-switch__input"
          />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>
    </div>

    <!-- Actions -->
    <div class="popup-actions">
      <button
        type="button"
        id="openInstagram"
        class="popup-actions__btn popup-actions__btn--primary"
      >
        <span class="popup-actions__btn-icon">📷</span>
        <span>Instagram</span>
      </button>
      <button
        type="button"
        id="openSettings"
        class="popup-actions__btn popup-actions__btn--secondary popup-tooltip"
        data-tooltip="Configurações Avançadas"
      >
        <span class="popup-actions__btn-icon">⚙️</span>
      </button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
