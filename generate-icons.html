<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: system-ui;
      padding: 20px;
      background: #111;
      color: #fff;
    }
    canvas {
      border: 1px solid #333;
      margin: 10px;
      background: #222;
    }
    button {
      padding: 10px 20px;
      background: #00ffff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px;
    }
    button:hover {
      background: #00cccc;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Generate Extension Icons</h1>
    <p>Click the buttons below to generate and download icons</p>
    
    <canvas id="icon16" width="16" height="16"></canvas>
    <canvas id="icon48" width="48" height="48"></canvas>
    <canvas id="icon128" width="128" height="128"></canvas>
    
    <div>
      <button onclick="generateIcons()">Generate Icons</button>
      <button onclick="downloadAll()">Download All Icons</button>
    </div>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Background circle
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fill();
      
      // Inner circle (user head)
      ctx.fillStyle = '#222222';
      const headSize = size * 0.28;
      ctx.beginPath();
      ctx.arc(size / 2, size * 0.32, headSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Body (ellipse)
      ctx.fillStyle = '#222222';
      const bodyWidth = size * 0.43;
      const bodyHeight = size * 0.37;
      ctx.beginPath();
      ctx.ellipse(size / 2, size * 0.69, bodyWidth, bodyHeight, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Unfollow indicator (X or minus)
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      const indicatorSize = size * 0.15;
      const indicatorX = size * 0.69;
      const indicatorY = size * 0.32;
      
      // Draw a minus sign
      ctx.beginPath();
      ctx.moveTo(indicatorX - indicatorSize / 2, indicatorY);
      ctx.lineTo(indicatorX + indicatorSize / 2, indicatorY);
      ctx.stroke();
    }

    function generateIcons() {
      const sizes = [16, 48, 128];
      sizes.forEach(size => {
        const canvas = document.getElementById(`icon${size}`);
        drawIcon(canvas, size);
      });
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    function downloadAll() {
      generateIcons();
      setTimeout(() => {
        downloadCanvas(document.getElementById('icon16'), 'icon16.png');
        setTimeout(() => {
          downloadCanvas(document.getElementById('icon48'), 'icon48.png');
          setTimeout(() => {
            downloadCanvas(document.getElementById('icon128'), 'icon128.png');
          }, 100);
        }, 100);
      }, 100);
    }

    // Generate on load
    window.addEventListener('load', generateIcons);
  </script>
</body>
</html>
