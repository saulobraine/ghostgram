version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostgram-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ghostgram
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.dev
    container_name: ghostgram-api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ghostgram?schema=public
      - NODE_ENV=development
      - PORT=3001
    ports:
      - '3001:3001'
    volumes:
      - ./packages/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm run dev

volumes:
  postgres_data:
