<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostGram</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-header__logo">
        <span class="popup-header__icon">👻</span>
        <span class="popup-header__title">GhostGram</span>
      </div>
      <span
        id="statusBadge"
        class="popup-header__status popup-header__status--inactive"
      >
        Inativo
      </span>
    </div>

    <!-- Main Toggle -->
    <div class="popup-main-toggle">
      <div class="popup-main-toggle__row">
        <span class="popup-main-toggle__label">Extensão</span>
        <label class="toggle-switch">
          <input type="checkbox" id="mainToggle" class="toggle-switch__input" />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>
    </div>

    <!-- Quick Settings -->
    <div class="popup-settings">
      <div class="popup-settings__title">Configurações Rápidas</div>

      <!-- Start Expanded -->
      <div class="popup-settings__item">
        <span class="popup-settings__item-label">Iniciar Expandido</span>
        <label class="toggle-switch toggle-switch--small">
          <input
            type="checkbox"
            id="startExpandedToggle"
            class="toggle-switch__input"
          />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>

      <!-- Stealth Mode -->
      <div class="popup-settings__item">
        <span class="popup-settings__item-label">Modo Discreto</span>
        <label class="toggle-switch toggle-switch--small">
          <input
            type="checkbox"
            id="stealthModeToggle"
            class="toggle-switch__input"
          />
          <span class="toggle-switch__slider"></span>
        </label>
      </div>
    </div>

    <!-- Actions — condicional: Instagram ou não -->
    <div class="popup-actions" id="actionsSection">
      <!-- Conteúdo injetado via JS -->
    </div>

    <!-- Auth Section (hidden by default) -->
    <div class="popup-auth" id="authSection" style="display: none;">
      <div class="popup-auth__title">Conectar com GhostGram</div>
      <div class="popup-auth__subtitle">
        Entre para sincronizar seus dados e acessar recursos premium
      </div>
      
      <div id="authForm">
        <input
          type="email"
          id="authEmail"
          class="popup-auth__input"
          placeholder="E-mail"
        />
        <input
          type="password"
          id="authPassword"
          class="popup-auth__input"
          placeholder="Senha"
        />
        <button id="loginBtn" class="popup-auth__button">Entrar</button>
        <button id="registerBtn" class="popup-auth__button popup-auth__button--secondary">
          Criar conta
        </button>
      </div>
      
      <div id="authStatus" style="display: none;">
        <div class="popup-auth__user">
          Conectado como: <strong id="userEmail"></strong>
        </div>
        <button id="logoutBtn" class="popup-auth__button popup-auth__button--small">
          Sair
        </button>
      </div>
      
      <div id="planStatus" style="display: none; margin-top: 12px;">
        <div class="popup-plan">
          <span class="popup-plan__label">Plano:</span>
          <span id="planName" class="popup-plan__name">Free</span>
        </div>
        <button id="upgradeBtn" class="popup-auth__button popup-auth__button--premium" style="display: none;">
          ✨ Fazer upgrade para Premium
        </button>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
