<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad128" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E4405F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#833AB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCAF45;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="128" height="128" fill="url(#grad128)" rx="12.8"/>
  
  <!-- Camera body (outer circle) -->
  <circle cx="64" cy="64" r="38.4" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Camera lens (middle circle) -->
  <circle cx="64" cy="64" r="23.04" fill="url(#grad128)"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="64" r="11.52" fill="#FFFFFF"/>
  
  <!-- Optional: Add "U" for Unfollowers -->
  <text x="64" y="83.2" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold"
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.8">U</text>
</svg>