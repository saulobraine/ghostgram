<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E4405F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#833AB4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCAF45;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="16" height="16" fill="url(#grad16)" rx="1.6"/>
  
  <!-- Camera body (outer circle) -->
  <circle cx="8" cy="8" r="4.8" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Camera lens (middle circle) -->
  <circle cx="8" cy="8" r="2.88" fill="url(#grad16)"/>
  
  <!-- Center dot -->
  <circle cx="8" cy="8" r="1.44" fill="#FFFFFF"/>
  
  <!-- Optional: Add "U" for Unfollowers -->
  <text x="8" y="10.4" 
        font-family="Arial, sans-serif" 
        font-size="4" 
        font-weight="bold"
        fill="#FFFFFF" 
        text-anchor="middle" 
        opacity="0.8">U</text>
</svg>